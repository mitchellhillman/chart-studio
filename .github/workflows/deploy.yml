name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install, lint, test, build
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Assemble Pages site (legacy at root, app at /app)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/app
          cp index.html bar-chart.js data.csv _site/
          cp -r data deco palettes _site/
          cp -r app/dist/. _site/app/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Deploy only for pushes to main; on pull requests the build job alone runs
  # as a lint/test/build check.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
